<!doctype html>
<html lang="fr">
<head>
{% include site-head.html %}
<title>{{ page.title }} | Opefitoo</title>
<meta name="description" content="{{ page.description | default: page.excerpt | strip_html | strip_newlines | truncate: 160 }}">
<meta property="og:title" content="{{ page.title }}">
<meta property="og:description" content="{{ page.description | default: page.excerpt | strip_html | strip_newlines | truncate: 200 }}">
<meta property="og:type" content="article">
<meta property="og:image" content="https://opefitoo.com/assets/apps/salaire-home.jpg">
<meta property="og:url" content="{{ page.url | absolute_url }}">
<link rel="canonical" href="{{ page.url | absolute_url }}">
<style>
.post { max-width: 760px; padding-block: clamp(32px, 5vw, 72px) clamp(56px, 7vw, 104px); }
.back { font-weight: 600; text-decoration: none; color: var(--ink-2); }
.back:hover { color: var(--cobalt); }
.post h1 { font-size: clamp(42px, 6vw, 88px); line-height: .92; margin: 20px 0 14px; text-wrap: balance; }
.meta { color: var(--ink-2); font-weight: 600; margin: 0 0 40px; }
.body { font-size: 19px; line-height: 1.65; }
.body h2, .body h3 { font-family: var(--display); font-weight: 800; letter-spacing: -0.03em; font-variation-settings: "wdth" 88; line-height: 1.05; margin: 1.8em 0 .5em; }
.body h2 { font-size: 34px; } .body h3 { font-size: 26px; }
.body a { color: var(--cobalt); text-underline-offset: 3px; }
.body img { max-width: 100%; border-radius: 18px; }
.body blockquote { margin: 1.5em 0; padding: 4px 0 4px 20px; border-left: 4px solid var(--saffron); color: var(--ink-2); }
.body code { font-size: .88em; background: var(--white); padding: 2px 6px; border-radius: 6px; }
.body pre { background: var(--ink); color: #E6E9F2; padding: 20px; border-radius: 16px; overflow-x: auto; font-size: 15px; line-height: 1.5; }
.body pre code { background: none; padding: 0; }
.body table { width: 100%; border-collapse: collapse; margin: 1.5em 0; font-size: 16px; font-variant-numeric: tabular-nums; }
.body th, .body td { padding: 10px 12px; border-bottom: 1.5px solid var(--line); text-align: left; vertical-align: top; }
.body th { font-weight: 600; color: var(--ink-2); font-size: 14.5px; }
.body td:not(:first-child), .body th:not(:first-child) { text-align: right; }
.body tbody tr:hover { background: var(--white); }
.table-scroll { overflow-x: auto; }
.body > p:first-child { font-size: 22px; line-height: 1.5; }
</style>
</head>
<body>
{% include site-bar.html %}
<main class="wrap">
  <article class="post">
    <a class="back" href="/blog/" data-i18n="back">Tous les articles</a>
    <h1 class="display">{{ page.title }}</h1>
    <p class="meta"><time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%d.%m.%Y" }}</time>{% if page.author %}, {{ page.author }}{% endif %}</p>
    <div class="body">{{ content }}</div>
  </article>
</main>
<section class="end">
  <div class="wrap">
    <h2><span data-i18n="end-a">Un projet ?</span> <span data-i18n="end-b">Parlons-en.</span></h2>
    <div class="actions"><a class="btn primary" href="/contact/" data-i18n="end-cta" data-umami-event="post-contact">Me contacter</a></div>
  </div>
</section>
{% include site-footer.html %}
<script>
window.OPE_T = {
  en: { "nav-apps": "Apps", "nav-about": "About", "nav-contact": "Contact", back: "All posts", "end-a": "A project?", "end-b": "Let’s talk.", "end-cta": "Contact me" },
  de: { "nav-apps": "Apps", "nav-about": "Über mich", "nav-contact": "Kontakt", back: "Alle Artikel", "end-a": "Ein Projekt?", "end-b": "Sprechen wir darüber.", "end-cta": "Kontakt aufnehmen" }
};
</script>
<script src="/assets/js/site.js"></script>
</body>
</html>
