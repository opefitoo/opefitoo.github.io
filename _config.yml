title: Mehdi Benammar – Opefitoo
description: Personal website of Mehdi Benammar
url: "https://opefitoo.github.io"
baseurl: ""
email: contact@opefitoo.com

# Build settings
markdown: kramdown
permalink: pretty
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

# Social media
social:
  linkedin: mehdi-benammar
  github: opefitoo
  email: contact@opefitoo.com

# Collections
collections:
  posts:
    output: true
    permalink: /blog/:year/:month/:day/:title/

# Defaults
defaults:
  - scope:
      path: ""
    values:
      layout: "default"
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"

# Exclude from processing
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - .gitignore
  - README.md
  - docker-compose.yml
  - Dockerfile
  - nginx
  - certbot

# Umami analytics (self-hosted). Fill website_id with the UUID from
# umami.opefitoo.com > Settings > Websites; empty means no tracking script.
umami:
  script: "https://umami.opefitoo.com/script.js"
  website_id: "62061a13-f1c4-4378-b176-0e3f064a1842"
